<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F8;--surface:#fff;--ink:#101B2B;--muted:#576579;--line:#DCE3EB;--accent:#1B4DDB;--accent-ink:#fff;--sun:#FFC72C;--tile1:#E3EAF3;--tile2:#CFD9E6;--win:#DCEBFA;--sh1:0 2px 10px rgba(15,26,43,.12);--f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--f-body:'DM Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F0F10;--surface:#18181A;--ink:#F2F2F2;--muted:#9A9A9F;--line:#2D2D31;--accent:#6E95FF;--accent-ink:#0A1220;--tile1:#26262B;--tile2:#1C1C20;--win:#3A3A44}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.45 var(--f-body)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--surface)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 40px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px var(--f-display);letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.logo small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
.pill{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh1);background:var(--surface);padding:6px 6px 6px 0}
.seg{padding:6px 22px;border-right:1px solid var(--line);text-align:left;white-space:nowrap}
.seg:nth-child(3){border-right:0}
.seg b{display:block;font-size:12px;font-weight:700}.seg span{font-size:14px;color:var(--muted)}
.go{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-left:6px}
.hr{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.hr .b{height:42px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:700}
.hr .b:hover{background:var(--bg)}
.menu{border:1px solid var(--line)!important}
.cats{display:flex;align-items:center;gap:8px;padding:0 40px;border-bottom:1px solid var(--line)}
.cats .row{display:flex;gap:34px;flex:1;overflow-x:auto;scrollbar-width:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 12px;color:var(--muted);font-size:12px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap}
.cat svg{width:26px;height:26px}
.cat:hover{color:var(--ink)}.cat.on{color:var(--ink);border-color:var(--ink)}
.fbtn{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
/* grid */
.main{padding:24px 40px 120px;max-width:1500px;margin:0 auto}
.count{color:var(--muted);font-size:14px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}
.card{display:block;text-align:left;width:100%}
.ph{position:relative;aspect-ratio:1/.92;border-radius:16px;background:linear-gradient(160deg,var(--tile1),var(--tile2));display:grid;place-items:center;overflow:hidden}
.ph svg.v{width:86%;height:auto;transition:transform .35s}
.card:hover .ph svg.v{transform:scale(1.05)}
.bd{position:absolute;left:12px;top:12px;background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.hrt{position:absolute;right:10px;top:10px;color:#fff;width:36px;height:36px;display:grid;place-items:center}
.hrt svg{width:26px;height:26px;fill:rgba(0,0,0,.38);stroke:#fff;stroke-width:1.8;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hrt.on svg{fill:#E0245E;stroke:#E0245E}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(16,27,43,.25)}.dots i:first-child{background:var(--ink)}
.t{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-weight:700}
.t span{font-weight:500;display:flex;gap:4px;align-items:center}
.t svg{width:13px;height:13px;fill:var(--ink);stroke:none}
.s{color:var(--muted);font-size:14px}
.pr{margin-top:4px}.pr b{font-weight:700}.pr span{color:var(--muted)}
.how{margin-top:56px;padding-top:32px;border-top:1px solid var(--line)}
.how h2{font:800 24px var(--f-display);margin:0 0 20px}
.hw{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.hw div{display:flex;flex-direction:column;gap:6px}
.hw .n{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.hw b{font-size:16px}.hw span{color:var(--muted);font-size:14px}
.mapb{display:none}
.tabs{display:none}
.sm{display:none}
/* phone */
@media(max-width:760px){
 .hrow{grid-template-columns:1fr auto;padding:12px 16px 10px;gap:10px}
 .hrow .logo,.hrow .hr{display:none}
 .pill{flex:1;padding:6px;box-shadow:var(--sh1)}.pill .seg{display:none}.pill .sm{display:flex;align-items:center;gap:12px;flex:1;padding:4px 10px}
 .pill .sm div{line-height:1.25}.pill .sm b{display:block;font-size:14px}.pill .sm span{font-size:12px;color:var(--muted)}
 .pill .go{display:none}
 .hrow{display:flex}
 .circ{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none}
 .cats{padding:0 16px}.cats .fbtn{display:none}.cats .row{gap:26px}
 .main{padding:14px 16px 150px}.grid{grid-template-columns:1fr;gap:26px}
 .ph{aspect-ratio:1/.78;border-radius:18px}
 .hw{grid-template-columns:1fr 1fr}
 .mapb{bottom:84px;padding:12px 18px}
 .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px 14px;z-index:30}
 .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
 .tabs .on{color:var(--accent)}
}
@media(min-width:761px){.circ{display:none}}

/* merge: request panel + add button */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.layout .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cart{position:sticky;top:170px;background:var(--surface);border-radius:20px;border:1px solid var(--line);padding:18px;box-shadow:0 6px 24px rgba(15,26,43,.12)}
.cart h3{font:800 20px var(--f-display);margin:0 0 4px}.cart .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.row2{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}.row2 b{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}.row2 svg{color:var(--accent)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;margin:10px 0}.empty svg{width:34px;height:34px;color:var(--line)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li .th{width:56px;aspect-ratio:16/10;border-radius:8px;background:linear-gradient(160deg,var(--tile1),var(--tile2));display:grid;place-items:center;flex:none}.li .th svg{width:84%;height:auto}
.li div.x{flex:1;line-height:1.25}.li b{font-size:14px}.li small{display:block;color:var(--muted)}.li button{color:var(--muted);font-size:20px;padding:4px 8px}
.tot{display:flex;justify-content:space-between;margin:12px 0 4px;font-weight:700}.tot span:last-child{font:800 18px var(--f-display)}
.cta{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin-top:10px}.cta[disabled]{opacity:.4;cursor:default}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.add{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:.15s;z-index:2}
.add.on{background:var(--accent);color:var(--accent-ink)}
.dots{display:none}
.crow{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}.crow .count{margin:0;flex:1}
.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip svg{width:16px;height:16px}
.cbar{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:31;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translateY(220px);visibility:hidden;transition:.25s,visibility 0s .25s}
.cbar.show{transform:none;visibility:visible;transition:.25s}.cbar .n{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800}
.cbar>div:not(.n){flex:1;line-height:1.2}.cbar small{display:block;opacity:.85;font-size:12px}.cbar b{font-size:16px}.cbar .rv{background:var(--surface);color:var(--accent);border-radius:12px;padding:10px 16px;font-weight:800}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.cart{display:none}.cbar{display:flex}}
@media(max-width:760px){.cbar{bottom:72px}.chip.hd{display:none}}

.logo{background:none;border:0;cursor:pointer;color:inherit}
.hr .b,.circ,.fbtn{position:relative}
em.bg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-body);font-style:normal;display:none;place-items:center;padding:0 4px}
.hr .b em.bg{position:static;margin-left:2px}
.fbtn em.bg{position:static}
.row2{width:100%;text-align:left;background:none;cursor:pointer}.row2:hover{border-color:var(--ink)}
.dl{position:absolute;left:12px;bottom:12px;background:rgba(16,27,43,.78);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.card{cursor:pointer}.hrt:active svg,.add:active{transform:scale(.88)}.hrt svg,.add{transition:transform .12s}
.card{animation:in .35s both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pg{font:800 26px var(--f-display);margin:0 0 16px}
.none{text-align:center;padding:60px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}.none b{color:var(--ink);font-size:18px}
.map{position:relative;aspect-ratio:16/8.5;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.map>svg{position:absolute;inset:0;width:100%;height:100%}
.pinb{position:absolute;transform:translate(-50%,-100%);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;text-align:center;line-height:1.1}.pinb small{display:block;font-weight:600;color:var(--muted);font-size:11px}.pinb:hover{background:var(--ink);color:var(--surface)}.pinb:hover small{color:var(--surface)}
/* sheets */
#ov{position:fixed;inset:0;z-index:60;display:none}#ov.on{display:block}
#ov .bk{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fadei .2s}
.sheet{position:absolute;background:var(--surface);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.sheet.pp{top:92px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 120px);animation:fadei .18s}
.sheet.md{top:50%;left:50%;transform:translate(-50%,-50%);width:min(800px,calc(100% - 48px));max-height:calc(100% - 60px);animation:fadei .18s}
@keyframes fadei{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font:800 18px var(--f-display)}
.sh-b{padding:16px 18px;overflow:auto}.sh-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}.x:hover{background:var(--bg)}.x:disabled{opacity:.3}
.x.ring{border:1px solid var(--line);width:38px;height:38px}
.lnk{font-weight:700;text-decoration:underline;color:var(--ink)}
.tbs{display:flex;gap:6px;padding:10px 18px 0}.tbs button{flex:1;padding:8px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);border:1px solid var(--line)}.tbs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opts{display:flex;flex-direction:column}.opt{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;text-align:left}.opt:hover{background:var(--bg)}.opt .oi{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}.opt small{display:block;color:var(--muted);font-size:12px}.opt>span:nth-child(2){flex:1;font-weight:700}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}.opt.on .rd{border:6px solid var(--accent)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal em{font:700 12px var(--f-body);color:var(--muted);font-style:normal;padding:6px 0}
.dy{aspect-ratio:1;border-radius:50%;font-weight:600}.dy:hover:not(:disabled){outline:2px solid var(--ink)}.dy:disabled{color:var(--line);cursor:default}.dy.in{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:0}.dy.on{background:var(--accent);color:var(--accent-ink)}
.hint{text-align:center;color:var(--muted);margin:10px 0 0}
.stp{display:flex;justify-content:space-between;align-items:center;gap:12px}.stp small{display:block;color:var(--muted)}.ctl{display:flex;gap:14px;align-items:center}.ctl b{min-width:34px;text-align:center;font-size:18px}
.fg{margin-bottom:20px}.fg>b{display:flex;justify-content:space-between;margin-bottom:10px}.pv{font-style:normal;color:var(--accent)}
.sg{display:flex;gap:8px;flex-wrap:wrap}.sg button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}.sg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dt{display:grid;grid-template-columns:1.15fr 1fr;overflow:auto}.dl2{background:linear-gradient(160deg,var(--tile1),var(--tile2))}.ph.big{height:100%;min-height:320px;aspect-ratio:auto;border-radius:0}.ph.big svg.v{width:88%}
.cl{position:absolute;left:12px;top:12px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2)}.ph.big .bd{left:auto;top:auto;right:14px;bottom:14px}
.dr{padding:22px;display:flex;flex-direction:column;gap:12px}.dr h3{font:800 24px var(--f-display);margin:0}
.ft{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ft li{display:flex;gap:10px;align-items:center}.ft svg{width:18px;height:18px;color:var(--accent)}
.pb{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}.pl{display:flex;justify-content:space-between;align-items:center}.pl b{font:800 18px var(--f-display)}.pl.s{color:var(--muted);font-size:14px}
.co{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;overflow:auto;overflow-x:hidden}.co>*,.cf>*,.row2n>*,.ph2>*,.tp2>*{min-width:0}.cf input,.cf select{width:100%;box-sizing:border-box;min-width:0}.cf{padding:18px;display:grid;gap:12px;align-content:start}.sm2{padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.fl{display:grid;gap:4px}.fl span{font-size:12px;font-weight:700;color:var(--muted)}.fl input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}.fl input:focus{outline:2px solid var(--accent);border-color:transparent}.fl em{font-style:normal;color:#B3261E;font-size:12px;min-height:0}.fl.bad input{border-color:#B3261E}
@media(prefers-color-scheme:dark){.fl em{color:#FF8A80}}
.ok{padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.ok h3{font:800 24px var(--f-display);margin:0}.okc{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}.okc svg{width:30px;height:30px}.okb{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;justify-content:center}
.prog{list-style:none;margin:10px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;text-align:center}
.prog li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.prog li i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;background:var(--surface);position:relative;z-index:1}
.prog li:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}
.prog li.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.prog li.done::after{background:var(--accent)}.prog li.cur i{border-color:var(--accent);color:var(--accent)}.prog li.cur{color:var(--ink)}
.prog svg{width:16px;height:16px}
.req{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;max-width:760px}.rh{display:flex;justify-content:space-between;gap:12px}.rh small{display:block;color:var(--muted)}.rt{font:800 18px var(--f-display)}.rm{color:var(--muted);font-size:14px;margin:6px 0}.ra{display:flex;justify-content:space-between;align-items:center;gap:10px}.ra small{color:var(--muted)}
.mn{display:grid;gap:2px}.mn button{display:flex;gap:14px;align-items:center;padding:14px 8px;border-radius:12px;font-weight:700;text-align:left}.mn button:hover{background:var(--bg)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}

.tp{display:grid;gap:10px}.tp .fl{margin:0}
.wheel{position:relative;display:flex;gap:4px;height:200px;background:var(--bg);border-radius:16px;overflow:hidden}
.wheel .band{position:absolute;left:8px;right:8px;top:80px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.wcol{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:80px 0;position:relative;z-index:1;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);overscroll-behavior:contain}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:40px;line-height:40px;scroll-snap-align:center;cursor:pointer;font:700 20px var(--f-display);color:var(--muted);transition:color .1s}.wcol div.on{color:var(--ink);font-size:22px}
.xh{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}.xh>div:first-child small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.xhc{display:flex;gap:14px;align-items:center;justify-content:center}
.scrub{position:relative;width:120px;height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:4px;cursor:ns-resize;touch-action:none;user-select:none}
.scrub.drag{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
