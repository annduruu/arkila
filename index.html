<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arkila Puerto Princesa</title>
<meta name="description" content="Rent a car or van from a local owner in Puerto Princesa. Pick a vehicle and dates, then send the request on Facebook.">
<meta property="og:title" content="Arkila Puerto Princesa">
<meta property="og:description" content="Rent a car or van from a local owner in Puerto Princesa. Request in two minutes.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header class="hdr"><div class="hwrap"><a class="top" href="#home"><i><svg width="20" height="14" viewBox="0 0 24 16" aria-hidden="true"><path d="M2 11 L5 6 Q7 3 11 3 L15 3 Q19 3 21 7 L22 11 Z" fill="#fff"/><circle cx="7" cy="12" r="2.6" fill="#FFC72C"/><circle cx="17" cy="12" r="2.6" fill="#FFC72C"/></svg></i><span>Arkila <small>Puerto Princesa</small></span></a><nav id="nav" aria-label="Main"></nav><button type="button" class="chip globe" id="thbtn" aria-label="Theme"></button><button type="button" class="chip globe" id="setbtn" data-setopen aria-label="Language and currency"></button></div></header>
<div class="demo">Demo mode: accounts, vehicles and requests are saved on this device only.</div>
<div class="wrap" id="v-home">
  <h1 data-i18n="h1">Rent a vehicle from a local owner</h1>
  <p class="lead" data-i18n="lead"></p>
  <div id="sampleBanner" class="banner" hidden data-i18n="sample"></div>
  <div class="sbar" role="search"><label><span class="lab" data-i18n="where">Where</span><select id="areaSel"></select></label><label><span class="lab" data-i18n="pickup">Pickup</span><input type="date" id="from"></label><label><span class="lab" data-i18n="return">Return</span><input type="date" id="to"></label><label><span class="lab" data-i18n="who">Who</span><select id="seats"><option value="0" data-i18n="anygroup"></option><option value="4" data-i18n="g4"></option><option value="7" data-i18n="g7"></option><option value="10" data-i18n="g10"></option></select></label></div>

  <div class="main">
  <section class="step o2" aria-labelledby="s2"><h2 id="s2" data-i18n="s2"></h2>
    <div class="chips" id="kinds" role="group" hidden></div>
    <div class="chips" id="types" role="group"></div>
    <div style="margin-bottom:10px"><label class="inl"><span class="lab" data-i18n="service"></span><select id="svc"><option value="any" data-i18n="any"></option><option value="Self-drive" data-i18n="selfdrive"></option><option value="With driver" data-i18n="withdriver"></option></select></label></div>
    <p class="note" id="count" style="margin:0 0 10px"></p>
    <div class="grid" id="grid"></div>
    <p class="note" data-i18n="tap"></p>
  </section>
  <section class="step o5"><h2 data-i18n="how.t"></h2>
    <ol class="rules"><li data-i18n="how.1"></li><li data-i18n="how.2"></li><li data-i18n="how.3"></li><li data-i18n="how.4"></li></ol>
  </section>
  </div>
  <div class="side">
  <section class="step o1" aria-labelledby="s1"><h2 id="s1" data-i18n="s1"></h2>
    <p class="note" style="margin:0 0 8px" id="pininfo"></p>
    <div id="map" class="map" role="region" data-i18n-aria="map.aria"></div>
    <div class="stack"><button type="button" class="btn ghost" id="locate" data-i18n="locate"></button></div>
  </section>
  <section class="step o3" aria-labelledby="s3"><h2 id="s3" data-i18n="s3"></h2>
    <form class="form" id="f" novalidate>
      <div id="chosen"></div>
      <p class="note" id="datesum" style="margin:0"></p>
      <label><span class="lab" data-i18n="f.name"></span><input id="name" autocomplete="name" placeholder="Juan Dela Cruz"></label>
      <label><span class="lab" data-i18n="f.mobile"></span><input id="phone" inputmode="tel" autocomplete="tel" data-i18n-ph="f.mobile.ph"></label>
      <label><span class="lab" data-i18n="f.ref"></span><input id="code" autocapitalize="characters" placeholder="e.g. MARIA"></label>
      <label><span class="lab" data-i18n="f.notes"></span><input id="notes" maxlength="140" data-i18n-ph="f.notes.ph"></label>
      <div class="q" id="quote" aria-live="polite"></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" data-i18n="f.submit"></button>
    </form>
  </section>
  <section class="step o4" id="out" aria-labelledby="s4" hidden><h2 id="s4" data-i18n="s4"></h2>
    <p class="note" style="margin:0 0 8px" data-i18n="s4note"></p>
    <div class="msgbox" id="msg"></div>
    <div class="stack">
      <button class="btn" type="button" id="copy" data-i18n="copy"></button>
      <a class="btn ghost" id="fb" href="#" target="_blank" rel="noopener" aria-disabled="true" data-i18n="messenger"></a>
    </div>
    <p class="note" id="fbnote"></p>
    <p class="note" id="reqnote"></p>
  </section>
  </div>
</div>
<div class="wrap" id="v-saved" hidden></div>
<div class="wrap" id="v-host" hidden></div>
<div class="wrap" id="v-trips" hidden></div>
<div class="wrap" id="v-admin" hidden></div>
<footer class="foot"><div class="fwrap"><div class="fcols"><div><b class="fname" id="fname"></b><p class="note" id="ftag" style="margin:2px 0 0"></p></div><div><span class="lab" data-i18n="foot.follow"></span><div class="soc" id="soc"></div></div></div><p class="note" data-i18n="foot.note"></p></div></footer>
<a class="fab" id="fab" href="#" target="_blank" rel="noopener" hidden aria-label="Chat on Messenger"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.4 2 2 6.1 2 11.3c0 2.9 1.4 5.4 3.6 7.1V22l3.3-1.8c.9.2 1.9.4 3.1.4 5.6 0 10-4.1 10-9.3S17.6 2 12 2zm1 12.5-2.6-2.7L5.4 14.5l5.5-5.8 2.6 2.7 5-2.7-5.5 5.8z"/></svg><span>Chat</span></a>
<dialog id="sdlg" aria-labelledby="stitle"><button type="button" class="x" data-sclose aria-label="Close">×</button><div id="sbody" style="padding:18px"></div></dialog>
<dialog id="ldlg" aria-labelledby="ltitle"><button type="button" class="x" data-lclose aria-label="Close">×</button><div id="lbody" style="padding:18px"></div></dialog>
<dialog id="dlg" aria-labelledby="dtitle"><button type="button" class="x" data-close aria-label="Close">×</button><div id="dbody"></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js?v=8"></script>
<script src="store.js?v=8"></script>
<script src="i18n.js?v=8"></script>
<script src="app.js?v=8"></script>
<script src="views.js?v=8"></script>
</body>
</html>
